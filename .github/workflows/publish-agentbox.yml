name: Publish Agentbox image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/publish-agentbox.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkedin-agent" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Agentbox image published"
            echo ""
            echo "Register in console.gmicloud.ai → Agentbox with:"
            echo ""
            echo "\`${{ steps.img.outputs.name }}:sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

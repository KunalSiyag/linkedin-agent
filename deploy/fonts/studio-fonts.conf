<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Recorded pages ask for macOS/Windows system fonts; render them in Inter and JetBrains Mono instead of DejaVu. -->
<fontconfig>
  <dir>/usr/local/share/fonts/studio</dir>
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family><family>Noto Sans CJK SC</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>ui-monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>SFMono-Regular</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Liberation Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>
